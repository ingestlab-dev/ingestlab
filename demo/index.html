<!doctype html>
<html lang="vi">
<head>

  <title>IngestLab | PDF, Video &amp; Image</title>
  <link rel="stylesheet" href="/demo/styles.css">
  <script type="importmap">
    {"imports":{"markdown-it":"/vendor/markdown-it.mjs"}}

  <script type="module" src="/demo/main.js"></script>

<body>
  <main>

        <button type="button" data-sample="2" disabled>S&#417; &#273;&#7891; &amp; bi&#7875;u &#273;&#7891; 2</button>

    </div>
  </main>
